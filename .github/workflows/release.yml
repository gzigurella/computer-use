name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  static:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Install build inputs
        run: sudo apt-get update && sudo apt-get install --yes musl-tools xkb-data
      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
      - name: Build the static Hyprland release
        run: cargo build --locked --release --target "$TARGET" --bin computer-use-linux
      - name: Verify the binary is static and MCP-conformant
        run: |
          binary="target/$TARGET/release/computer-use-linux"
          if readelf -d "$binary" | grep -Eq '\((NEEDED|RPATH|RUNPATH)\)'; then
            echo "static release has dynamic library dependencies"
            exit 1
          fi
          if readelf -l "$binary" | grep -q INTERP; then
            echo "static release has an ELF interpreter"
            exit 1
          fi
          python3 scripts/mcp-conformance.py "$binary"
      - name: Package
        run: |
          name="computer-use-linux-${GITHUB_REF_NAME}-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/computer-use-linux" "dist/$name/"
          cp -r LICENSE licenses README.md DEPENDENCY-BOM.md dependency-bom.cdx.json "dist/$name/"
          dpkg-query -W -f='xkb-data ${Version}\n' xkb-data > "dist/$name/BUNDLED-XKB-DATA"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: static
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes "Static x86_64 and aarch64 Linux builds of the Hyprland backend. Each archive's BUNDLED-XKB-DATA names the XKB data it embeds. Install with scripts/install-release.sh, or see the README."
