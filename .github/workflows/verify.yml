name: Verify Linux desktop backends

on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit server dependencies
        run: cargo audit --file Cargo.lock
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint every feature set
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Verify CycloneDX dependency BOM
        run: python3 scripts/generate-dependency-bom.py --check
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes dbus-daemon musl-tools
      - name: Run default Hyprland-only unit tests
        run: cargo test --locked --bin computer-use-linux
      - name: Run unit tests for experimental backends
        run: dbus-run-session -- cargo test --locked --all-features --bin computer-use-linux
      - name: Check the default Hyprland-only build
        run: cargo check --locked --bin computer-use-linux
      - name: Check MCP protocol conformance of the default build
        run: |
          cargo build --locked --bin computer-use-linux
          python3 scripts/mcp-conformance.py target/debug/computer-use-linux
      - name: Build and verify the static Hyprland release
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin computer-use-linux
          binary=target/x86_64-unknown-linux-musl/release/computer-use-linux
          if readelf -d "$binary" | grep -Eq '\((NEEDED|RPATH|RUNPATH)\)'; then
            echo "static release has dynamic library dependencies"
            exit 1
          fi
          if readelf -l "$binary" | grep -q INTERP; then
            echo "static release has an ELF interpreter"
            exit 1
          fi
          python3 scripts/mcp-conformance.py "$binary"

  # The experimental X11 and Sway backends run headless (Xvfb, headless Sway), so
  # their smoke tests run here, but they report without blocking: the experimental
  # backends are not supported. Hyprland needs a GPU render node, which GitHub's
  # runners lack, so its smoke tests run locally (see README, Verify).
  experimental-backends:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install --yes dbus-daemon foot gir1.2-gtk-4.0 grim imagemagick libxtst6 python3-gi sway wlr-randr wtype xvfb
      - name: Build release server with experimental backends
        run: cargo build --locked --release --features backend-x11,backend-sway,backend-portal --bin computer-use-linux
      - name: Exercise X11 capture and input under Xvfb
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python3 scripts/x11-smoke.py target/release/computer-use-linux
      - name: Exercise Wayland capture and input under headless Sway
        if: always()
        run: dbus-run-session -- python3 scripts/wayland-smoke.py target/release/computer-use-linux
