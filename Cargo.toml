[package]
name = "computer-use-linux"
version = "0.1.0"
edition = "2024"
description = "Harness-independent Linux desktop computer-use MCP server"
license = "MIT"

[features]
default = []
backend-x11 = []
backend-sway = []
backend-portal = []

[dependencies]
atspi = { version = "0.30.0", default-features = false, features = ["proxies", "tokio"] }
base64 = "0.22.1"
futures-util = "0.3.31"
jpeg-encoder = "0.6.1"
memmap2 = "0.9.9"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.3", features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wkb = { package = "wayland-keyboard", version = "0.3.3", default-features = false, features = ["compositor", "xkb"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
